name: auth
description: A new Flutter package for the Auth feature.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.13.1

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Local Packages
  core:
    path: ../../core
  shared:
    path: ../../shared

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase Services
  firebase_auth: ^5.3.4

  # Authentication
  flutter_facebook_auth: ^7.1.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # Utilities
  dartz: ^0.10.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
